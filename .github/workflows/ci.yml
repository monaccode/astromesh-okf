name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --python ${{ matrix.python }} pytest -q
  extras:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { extra: langchain, test: test_langchain.py }
          - { extra: crewai, test: test_crewai.py }
          - { extra: adk, test: test_adk.py }
          - { extra: openai-agents, test: test_openai_agents.py }
          - { extra: pydantic-ai, test: test_pydantic_ai.py }
          - { extra: agent-framework, test: test_agent_framework.py }
          - { extra: llamaindex, test: test_llamaindex.py }
          - { extra: smolagents, test: test_smolagents.py }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra ${{ matrix.extra }} --python 3.12
      - run: uv run --python 3.12 pytest -q tests/integrations/${{ matrix.test }}
