[project]
name = "astromesh-okf"
version = "0.1.0"
description = "Let AI agents navigate Open Knowledge Format (OKF) bundles: tools for LangChain/LangGraph, CrewAI, Google ADK, OpenAI Agents, PydanticAI, LlamaIndex, smolagents, Microsoft Agent Framework and MCP."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Juan Carlos Romero", email = "jc@fulfaro.dev" }]
keywords = ["okf", "open-knowledge-format", "agents", "llm", "langchain", "langgraph", "crewai", "google-adk", "mcp", "knowledge-base"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
langchain = ["langchain-core>=1.6"]
crewai = ["crewai>=1.15"]
adk = ["google-adk>=1.14"]
openai-agents = ["openai-agents>=0.20"]
pydantic-ai = ["pydantic-ai-slim>=2.55; python_version >= '3.11'"]
llamaindex = ["llama-index-core>=0.14"]
smolagents = ["smolagents>=1.26"]
agent-framework = ["agent-framework>=1.19"]
mcp = ["mcp>=1.28"]

[project.scripts]
astromesh-okf = "astromesh_okf.cli:main"

[project.urls]
Homepage = "https://github.com/monaccode/astromesh-okf"
Issues = "https://github.com/monaccode/astromesh-okf/issues"
"OKF spec" = "https://github.com/GoogleCloudPlatform/open-knowledge-format"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["astromesh_okf"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "W", "I", "UP", "B", "C4", "SIM", "RET", "PERF", "PIE", "DTZ", "LOG", "G", "PT", "N", "PTH", "RUF", "BLE", "PLE", "PLW"]

[tool.ruff.lint.per-file-ignores]
# Optional/Union on purpose: google-adk's schema builder rejects `X | None` (see module docstring).
"astromesh_okf/tools.py" = ["UP007", "UP045"]
